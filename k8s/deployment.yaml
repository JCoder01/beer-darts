apiVersion: apps/v1
kind: Deployment
metadata:
  name: beer-darts
  labels:
    app.kubernetes.io/name: beer-darts
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: beer-darts
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: beer-darts
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101          # the nginx user in nginx-unprivileged
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: beer-darts:0.1.0
          # IfNotPresent so an image side-loaded with `ctr images import`
          # is not chased into a registry that does not have it.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              # No CPU limit on purpose: serving static files is bursty and
              # throttling only adds latency. Memory is capped.
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          volumeMounts:
            # readOnlyRootFilesystem: nginx still needs somewhere for its pid
            # and temp bodies, which this image keeps under /tmp.
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
