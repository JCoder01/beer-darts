server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset       utf-8;
    server_tokens off;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 256;
    gzip_types      text/plain text/css application/javascript application/json
                    application/manifest+json image/svg+xml;

    # Filenames are not content-hashed, so everything revalidates rather than
    # being pinned. The whole app is well under 100 KB and ETags turn each
    # revalidation into a 304.
    add_header Cache-Control        "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options       "SAMEORIGIN" always;
    add_header Referrer-Policy       "same-origin" always;

    location = /healthz {
        access_log   off;
        default_type text/plain;
        return       200 "ok\n";
    }

    # nginx's mime.types has no entry for .webmanifest, so the extension is
    # unknown and default_type supplies the right one here.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # The service worker must never be pinned or clients stay on an old build.
    # A nested add_header replaces the inherited set, so they are repeated.
    location = /sw.js {
        add_header Cache-Control        "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options       "SAMEORIGIN" always;
        add_header Referrer-Policy       "same-origin" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
